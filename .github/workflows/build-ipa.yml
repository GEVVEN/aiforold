name: Build unsigned IPA

# 在 GitHub 的 macOS 机器上编译出未签名的 .ipa。
# 免费账号也能用；产物在 Actions 页面的 Artifacts 里下载。
#
# 拿到 ipa 之后，Windows 上用 Sideloadly / AltStore 用你自己的 Apple ID 签名安装即可，
# 详细步骤见 docs/构建与安装.md。
#
# 步骤顺序有意为之：
#   1) python 静态自检（不需要 Xcode，先拦掉低级问题）
#   2) swiftc -typecheck（真编译器语义检查，不链接不签名，几秒出结果）
#   3) ibtool 校验启动图
#   4) 真正出包
# 2/3 用 continue-on-error，这样即使它们报错也能看到完整诊断，而不是一个笼统的失败。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Xcode 15.x 仍然允许 iOS 12.0 作为部署目标；
      # 如果这一步失败（镜像更新导致 15.4 不可用），把版本改成 'latest-stable'。
      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          echo "--- 可用的 scheme / target ---"
          xcodebuild -list -project AIAssistant.xcodeproj || true

      - name: Verify project file matches sources
        run: python3 tools/generate_pbxproj.py --check

      - name: Static self-check (iOS 12 compatibility)
        run: python3 tools/check_ios12.py

      # 关键诊断 1：用真 swiftc 做全量类型检查（不链接、不签名、不需要证书）。
      # 有语法/类型/可用性问题时，这里会精确到 文件:行。
      - name: Swift type-check (no link, no signing)
        continue-on-error: true
        run: |
          set +e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK = $SDK"
          COUNT="$(find AIAssistant/Sources -name '*.swift' | wc -l | tr -d ' ')"
          echo "源文件数 = $COUNT"
          SOURCES="$(find AIAssistant/Sources -name '*.swift' | sort | tr '\n' ' ')"
          xcrun --sdk iphoneos swiftc \
            -typecheck \
            -swift-version 5 \
            -target arm64-apple-ios12.0 \
            -sdk "$SDK" \
            $SOURCES > typecheck.log 2>&1
          echo "swiftc -typecheck 退出码: $?"
          echo "--- error 行 ---"
          grep -E "error:" typecheck.log | head -n 40
          echo "--- 末尾 5 行 ---"
          tail -n 5 typecheck.log

      # 关键诊断 2：单独用 ibtool 编译启动图，确认 storyboard 本身没问题。
      - name: Validate LaunchScreen.storyboard (ibtool)
        continue-on-error: true
        run: |
          set +e
          xcrun ibtool --errors --warnings --notices \
            --compile "$RUNNER_TEMP/LaunchScreen.storyboardc" \
            AIAssistant/LaunchScreen.storyboard > ibtool.log 2>&1
          echo "ibtool 退出码: $?"
          cat ibtool.log

      # 关键点：xcodebuild 不允许 -target 与 -derivedDataPath 同时出现
      # （会报 “在指定 -derivedDataPath 时，必须使用 -scheme …”）。
      # 所以主路径用共享 scheme；万一 scheme 丢失，自动回退到 -target + CONFIGURATION_BUILD_DIR。
      - name: Build unsigned app
        run: |
          set -o pipefail
          rm -rf build build.log
          SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="")

          echo "=== 尝试 1：-scheme + -derivedDataPath ==="
          if xcodebuild \
               -project AIAssistant.xcodeproj \
               -scheme AIAssistant \
               -configuration Release \
               -destination 'generic/platform=iOS' \
               -derivedDataPath build \
               "${SIGN_ARGS[@]}" \
               build > build.log 2>&1; then
            tail -n 60 build.log
          else
            echo "scheme 方式失败，日志末尾："
            tail -n 60 build.log
            echo "=== 尝试 2：-target + CONFIGURATION_BUILD_DIR ==="
            xcodebuild \
              -project AIAssistant.xcodeproj \
              -target AIAssistant \
              -configuration Release \
              -sdk iphoneos \
              CONFIGURATION_BUILD_DIR="$PWD/build/Products" \
              "${SIGN_ARGS[@]}" \
              build 2>&1 | tee -a build.log | tail -n 60
          fi

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/AIAssistant.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "预期路径不存在，自动搜索 .app …"
            # 末尾的 || true 是必须的：pipefail 下 find 被 head 提前关管道会返回非零
            APP_PATH="$(find build -maxdepth 6 -type d -name 'AIAssistant.app' | head -n 1 || true)"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "没有找到构建产物 AIAssistant.app"
            ls -R build/Build/Products 2>/dev/null || true
            exit 1
          fi
          echo "使用产物：$APP_PATH"
          rm -rf Payload AIAssistant-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AIAssistant-unsigned.ipa Payload
          ls -lh AIAssistant-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-unsigned-ipa
          path: AIAssistant-unsigned.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            typecheck.log
            ibtool.log
          if-no-files-found: ignore

      # 让报错直接出现在 Actions 页面上，不用下载 artifact 才能看到
      - name: Surface errors
        if: failure()
        run: |
          set +e
          for f in typecheck.log ibtool.log build.log; do
            [ -f "$f" ] || continue
            echo "===================== $f ====================="
            grep -nE "error:|错误:|does not contain|cannot|Command .* failed" "$f" \
              | head -n 40 | while IFS= read -r line; do
                echo "::error::$f: $line"
                echo "$line"
              done
            echo "----- 末尾 80 行 -----"
            tail -n 80 "$f"
          done
          exit 0

name: Build unsigned IPA

# 在 GitHub 的 macOS 机器上编译出未签名的 .ipa。
# 免费账号也能用；产物在 Actions 页面的 Artifacts 里下载。
#
# 拿到 ipa 之后，Windows 上用 Sideloadly / AltStore 用你自己的 Apple ID 签名安装即可，
# 详细步骤见 docs/构建与安装.md。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Xcode 15.x 仍然允许 iOS 12.0 作为部署目标；
      # 如果这一步失败（镜像更新导致 15.4 不可用），把版本改成 'latest-stable'。
      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Verify project file matches sources
        run: python3 tools/generate_pbxproj.py --check

      - name: Static self-check (iOS 12 compatibility)
        run: python3 tools/check_ios12.py

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project AIAssistant.xcodeproj \
            -target AIAssistant \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log | tail -n 60

      - name: Package into .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AIAssistant.app"
          test -d "$APP_PATH" || { echo "构建产物不存在：$APP_PATH"; exit 1; }
          rm -rf Payload AIAssistant-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AIAssistant-unsigned.ipa Payload
          ls -lh AIAssistant-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-unsigned-ipa
          path: AIAssistant-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
